# Modularity editor sound theme.
#
#   cue = file | file | ...   Several files form a variant pool; each play picks one at
#                             random and never repeats the previous pick.
#   cue.gain = 0.0 - 4.0      Linear gain on top of the volume the editor asks for (which the
#                             UI volume setting, 0.5 by default, scales again).
#
#   cue = none                This theme plays nothing for the cue.
#
# A cue left out falls back to the default theme (Sleek). Edits are picked up when a theme
# is selected again (Workflow > Feedback Sounds, or the launcher's Sound settings).
#
# These files peak at -5 dBFS, far hotter than the Expressive set, so most cues are pulled
# down. Gains were matched on the loudest 400 ms window against the Expressive cue each one
# replaces; the comments give the Sleek level at gain 1.0 vs the Expressive level.

name = Sleek
description = Short, soft interface sounds. Taps and swipes rotate through variants.

# Settings tabs and toolbar tools. -33.9 dB vs a -44.7 dB tick that was barely audible.
tick = tap_01.wav | tap_02.wav | tap_03.wav | tap_04.wav | tap_05.wav
tick.gain = 0.45

# Launcher sidebar pages slide in, so a swipe. -27.9 dB.
section_switch = swipe_01.wav | swipe_02.wav | swipe_03.wav | swipe_04.wav | swipe_05.wav
section_switch.gain = 0.35

# Opening a project, picking a theme. -29.2 dB vs -22.8 dB.
confirm = select.wav
confirm.gain = 1.25

# About, Rename, Delete / Reload confirmations. Rising sweep, -19.6 dB vs -13.8 dB.
dialog_open = transition_up.wav
dialog_open.gain = 0.7

# Package safety warning. -16.9 dB vs -18.5 dB.
warning = caution.wav
warning.gain = 0.7

# Console errors and failed compiles. -16.9 dB vs -22.2 dB.
error = caution.wav
error.gain = 0.5

# A compile kicked off: a quiet click, where Expressive played a 6 s chime.
compile_start = button.wav
compile_start.gain = 0.8

# Background compile finished. -18.3 dB vs -26.8 dB.
compile_success = notification.wav
compile_success.gain = 0.45

# Script dropped onto an object. Rising two-note check, -29.5 dB vs -29.3 dB.
script_assigned = toggle_on.wav
script_assigned.gain = 1.0

# ModuPAK installed. -18.3 dB vs -21.2 dB.
package_installed = celebration.wav
package_installed.gain = 0.6

# --- Interface sounds, reported by the widgets themselves -----------------------------------
# Each group has its own switch under Workflow > Feedback Sounds. These play far more often
# than the cues above, so they sit lower.

# Every button, menu command and item picked from a menu or dropdown. -26.7 dB.
button = button.wav
button.gain = 0.4

# Clicking a greyed-out button. -27.1 dB.
button_disabled = disabled.wav
button_disabled.gain = 0.6

# Tabs, dock tabs included. Same taps as the settings ticks.
tab = tap_01.wav | tap_02.wav | tap_03.wav | tap_04.wav | tap_05.wav
tab.gain = 0.45

# Checkboxes, switches, radio buttons, toggle menu items. Rising / falling two notes, -29.5 dB.
toggle_on = toggle_on.wav
toggle_on.gain = 0.6
toggle_off = toggle_off.wav
toggle_off.gain = 0.6

# Menus, dropdowns and context menus sliding out, dock drawers, expanding sections.
slide_open = swipe_01.wav | swipe_02.wav | swipe_03.wav | swipe_04.wav | swipe_05.wav
slide_open.gain = 0.35
slide_close = swipe_01.wav | swipe_02.wav | swipe_03.wav | swipe_04.wav | swipe_05.wav
slide_close.gain = 0.25

# Modal dialogs scaling in and out. -19.6 / -18.4 dB.
popup_open = transition_up.wav
popup_open.gain = 0.7
popup_close = transition_down.wav
popup_close.gain = 0.5

# Picking a file or folder in the File Browser. Same taps as tabs.
item_select = tap_01.wav | tap_02.wav | tap_03.wav | tap_04.wav | tap_05.wav
item_select.gain = 0.5

# The pointer arriving on a button, menu item, tab, checkbox or list row. The quietest cue:
# it fires the most. -36.3 dB, 10 ms clicks.
hover = type_01.wav | type_02.wav | type_03.wav | type_04.wav | type_05.wav
hover.gain = 0.5

# Not mapped to a cue yet: progress_loop.wav, ringtone_loop.wav.
# swipe.wav is a byte-identical copy of swipe_01.wav.
